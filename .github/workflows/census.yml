name: census

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out agent-guard (the scanner the census feeds)
        uses: actions/checkout@v4
        with:
          repository: ciceroyang/agent-guard
          path: agent-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
      - run: node mcp-audit.mjs --max 6000 --out census.json --markdown census.md
      - name: Run agent-guard over the resolved packages
        run: |
          node scripts/guard-scan.mjs \
            --census census.json \
            --agent-guard ./agent-guard \
            --out guard-scan.json \
            --summary guard-scan.md
      - name: Publish the rolling census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mcp-census >/dev/null 2>&1 || gh release create mcp-census --title "MCP supply-chain census" --notes "Rolling census of the official MCP registry with per-finding provenance."
          gh release upload mcp-census census.json census.md guard-scan.json guard-scan.md --clobber
          { cat census.md; printf "\n\n---\n\n"; cat guard-scan.md; } > release-notes.md
          gh release edit mcp-census --notes-file release-notes.md
